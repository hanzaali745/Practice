apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: demo-config
    behavior: merge
    literals:
      - APP_MESSAGE=Hello from PROD
patches:
  - target: { kind: HorizontalPodAutoscaler, name: demo }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target: { kind: PodDisruptionBudget, name: demo }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
