apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - demo.yaml
  - redis.yaml
  - ingress.yaml
  - autoscaling.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: demo-platform
configMapGenerator:
  - name: demo-config
    literals:
      - APP_MESSAGE=Hello from the demo platform
      - REDIS_HOST=redis
images:
  - name: demo-app
    newTag: 1.0.0
