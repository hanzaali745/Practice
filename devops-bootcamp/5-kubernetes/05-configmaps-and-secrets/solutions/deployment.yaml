# Labs 1-3 — demo-app reading config from a ConfigMap (env + file) and a Secret (files)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: app
          image: demo-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: demo-config
          volumeMounts:
            - name: config
              mountPath: /etc/demo
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: demo-config
            items:
              - key: settings.ini
                path: settings.ini
        - name: secrets
          secret:
            secretName: demo-secret
            defaultMode: 0400
