# Lab 4 — the app only starts once a "redis" service answers on port 6379
apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels:
    app: init-demo
spec:
  initContainers:
    - name: wait-for-redis
      image: busybox:1.36
      command: ["sh", "-c", "until nc -z -w 2 redis 6379; do echo 'waiting for redis...'; sleep 2; done; echo 'redis is up'"]
  containers:
    - name: app
      image: demo-app:1.0.0
      imagePullPolicy: IfNotPresent
      env:
        - name: REDIS_HOST
          value: redis
      ports:
        - containerPort: 8000
