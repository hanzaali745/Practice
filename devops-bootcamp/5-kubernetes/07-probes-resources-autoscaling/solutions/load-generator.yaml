# Lab 3 — 4 parallel clients hammering /work (each request burns 200 ms of CPU)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load
  template:
    metadata:
      labels:
        app: load
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -qO- 'http://demo/work?ms=200' > /dev/null 2>&1; done"]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
