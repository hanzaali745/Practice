# Lab 2 — allocates ~200 MiB with a 64 MiB limit → OOMKilled, then CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
    - name: hog
      image: python:3.12-slim
      command: ["python3", "-c", "import time; data = bytearray(200 * 1024 * 1024); print('allocated'); time.sleep(3600)"]
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
