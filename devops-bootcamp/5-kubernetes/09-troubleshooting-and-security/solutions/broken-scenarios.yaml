# Lab 1 — five broken apps in namespace "broken". Find and fix each one!
apiVersion: v1
kind: Namespace
metadata:
  name: broken
---
# 1) web-1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-1
  namespace: broken
spec:
  replicas: 1
  selector:
    matchLabels: { app: web-1 }
  template:
    metadata:
      labels: { app: web-1 }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpinee
---
# 2) web-2 + its Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-2
  namespace: broken
spec:
  replicas: 2
  selector:
    matchLabels: { app: web-2 }
  template:
    metadata:
      labels: { app: web-2 }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: web-2
  namespace: broken
spec:
  selector: { app: web2 }
  ports:
    - port: 80
      targetPort: 80
---
# 3) worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: broken
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "test -n \"$QUEUE_URL\" || { echo 'FATAL: QUEUE_URL is not set' >&2; exit 1; }; sleep 3600"]
---
# 4) web-4
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-4
  namespace: broken
spec:
  replicas: 1
  selector:
    matchLabels: { app: web-4 }
  template:
    metadata:
      labels: { app: web-4 }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 3
---
# 5) batch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: broken
spec:
  replicas: 1
  selector:
    matchLabels: { app: batch }
  template:
    metadata:
      labels: { app: batch }
    spec:
      containers:
        - name: batch
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              memory: 500Gi
# ─────────────────────────────────────────────────────────────────────────────
# HINTS (try without them first!)
# 1 web-1:  ImagePullBackOff — typo in the image tag ("alpinee").
# 2 web-2:  pods fine, but the Service selector says app=web2 (no dash) → no endpoints.
# 3 worker: CrashLoopBackOff — logs --previous says QUEUE_URL is missing → add the env var.
# 4 web-4:  Running but 0/1 READY — readiness probe uses port 8080, nginx listens on 80.
# 5 batch:  Pending — requests 500Gi of memory; describe → FailedScheduling "Insufficient memory".
