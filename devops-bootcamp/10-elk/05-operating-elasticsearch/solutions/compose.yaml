# Module 05 — Elasticsearch with SECURITY ON, a snapshot repository, and Kibana logging in as kibana_system
name: elk05

services:
  elasticsearch:
    image: elastic/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"      # lab: plain HTTP on localhost. Production: TLS (Lesson 5.2)
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-bootcamp-elastic}   # the built-in superuser
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      path.repo: /snapshots                          # where snapshot repositories may live
      cluster.routing.allocation.disk.watermark.low: 2gb
      cluster.routing.allocation.disk.watermark.high: 1gb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
    mem_limit: 1536m                                # heap 512m + off-heap; 1 GB is too tight once Kibana is busy
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-snapshots:/snapshots
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$${ELASTIC_PASSWORD} localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s || exit 1"]
      interval: 10s
      retries: 30

  setup:                                             # one-shot: snapshot folder ownership + kibana_system password
    image: elastic/elasticsearch:9.5.4
    user: root                                       # to chown the snapshot volume (new volumes belong to root)
    volumes: ["es-snapshots:/snapshots"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-bootcamp-elastic}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-bootcamp-kibana}
    entrypoint: ["bash", "-c", "chown -R 1000:0 /snapshots && curl -fsS -u elastic:$${ELASTIC_PASSWORD} -X POST http://elasticsearch:9200/_security/user/kibana_system/_password -H 'Content-Type: application/json' -d \"{\\\"password\\\": \\\"$${KIBANA_PASSWORD}\\\"}\" && echo ' kibana_system password set'"]
    depends_on:
      elasticsearch: {condition: service_healthy}
    restart: "no"

  kibana:
    image: elastic/kibana:9.5.4
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system          # Kibana's own service user — never "elastic"
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-bootcamp-kibana}
      TELEMETRY_OPTIN: "false"
    mem_limit: 1536m
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      setup: {condition: service_completed_successfully}

volumes:
  es-data:
  es-snapshots:
