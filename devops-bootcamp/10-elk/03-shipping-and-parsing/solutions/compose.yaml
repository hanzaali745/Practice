# Module 03 — app (JSON logs) + nginx (text logs) → Filebeat → Logstash (parse) → Elasticsearch
name: elk03

services:
  elasticsearch:
    image: elastic/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"                # LAB ONLY (Module 05 turns it on)
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.watermark.low: 2gb
      cluster.routing.allocation.disk.watermark.high: 1gb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
    mem_limit: 1g
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s || exit 1"]
      interval: 10s
      retries: 30

  setup:                                             # one-shot: install the index template, then exit
    image: elastic/elasticsearch:9.5.4
    entrypoint: ["curl", "-fsS", "-X", "PUT", "http://elasticsearch:9200/_index_template/demo-logs",
                 "-H", "Content-Type: application/json", "--data-binary", "@/template.json"]
    volumes: ["./index-template.json:/template.json:ro"]
    depends_on:
      elasticsearch: {condition: service_healthy}
    restart: "no"

  logstash:
    image: elastic/logstash:9.5.4
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_ECS_COMPATIBILITY: v8
    mem_limit: 1g
    volumes: ["./logstash/pipeline:/usr/share/logstash/pipeline:ro"]
    depends_on:
      setup: {condition: service_completed_successfully}

  filebeat:
    image: elastic/filebeat:9.5.4
    user: root                                       # to read other containers' log files
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data       # remembers how far it read (the registry)
    depends_on: [logstash]

  app:
    build:
      context: ../../../4-docker/app
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY app.py /app/app.py
        USER 10001
        CMD ["python3", "/app/app.py"]
    environment:
      LOG_FORMAT: json
      APP_VERSION: "2.1.0"
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.29-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:8080:80"]
    depends_on: [app]

  load:
    image: python:3.12-slim
    command: ["python3", "/loadgen.py", "http://nginx", "8", "0.05"]
    volumes: ["./loadgen.py:/loadgen.py:ro"]
    depends_on: [nginx]

volumes:
  es-data:
  filebeat-data:
