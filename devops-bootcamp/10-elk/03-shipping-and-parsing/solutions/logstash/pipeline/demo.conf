# Logstash pipeline: input → filter (parse + normalise to ECS) → output
input {
  beats { port => 5044 }
}

filter {
  # Which compose service did this line come from?
  mutate { copy => { "[container][labels][com_docker_compose_service]" => "[@metadata][source]" } }

  if [@metadata][source] == "app" {
    # demo-app already writes ECS JSON: parse it onto the event (its @timestamp becomes the event time)
    json { source => "message" }
  } else if [@metadata][source] == "nginx" {
    # nginx writes plain text → grok turns it into fields. Two formats: the access log ("combined") and the
    # error log ("2026/10/03 07:32:13 [notice] 1#1: ..."). Grok tries the patterns in order.
    grok {
      match => { "message" => [
        '%{IPORHOST:[client][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[@metadata][ts]}\] "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}" %{NUMBER:[http][response][status_code]:int} %{NUMBER:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"',
        '%{DATA:[@metadata][ts]} \[%{LOGLEVEL:[log][level]}\] %{POSINT:[process][pid]:int}#%{NUMBER}: %{GREEDYDATA:[nginx][error][message]}'
      ] }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }
    date { match => ["[@metadata][ts]", "dd/MMM/yyyy:HH:mm:ss Z", "yyyy/MM/dd HH:mm:ss"] }
    mutate { add_field => { "[service][name]" => "nginx" } }
    # a log level from the status code, so app and nginx logs filter the same way
    if [http][response][status_code] {
      if [http][response][status_code] >= 500 { mutate { add_field => { "[log][level]" => "error" } } }
      else if [http][response][status_code] >= 400 { mutate { add_field => { "[log][level]" => "warn" } } }
      else { mutate { add_field => { "[log][level]" => "info" } } }
    }
  }

  # drop the bulky metadata we don't need (keep container.name and image for context)
  mutate { remove_field => ["agent", "ecs", "input", "[container][labels]", "[log][file]", "[log][offset]", "stream"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "demo-logs-%{[service][name]}-%{+YYYY.MM.dd}"     # one index per service per day
  }
}
