# A local, fake AWS for practising — moto server. Free, offline, resettable. NOT a real cloud: nothing actually runs.
name: local-aws
services:
  moto:
    image: motoserver/moto:5.2.3
    environment:
      MOTO_PORT: "5000"
      MOTO_IAM_LOAD_MANAGED_POLICIES: "true"     # know AWS-managed policies like AmazonSSMManagedInstanceCore
    ports: ["127.0.0.1:5000:5000"]     # dashboard: http://localhost:5000/moto-api/
