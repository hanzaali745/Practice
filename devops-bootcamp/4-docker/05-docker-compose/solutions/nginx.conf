# Reverse proxy: Docker's DNS resolves "app" to every replica.
# `resolver` + a variable make nginx re-resolve, so scaling up/down is picked up.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s;      # Docker's embedded DNS server
    set $backend http://app:8000;

    location / {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
