#cloud-config
# Runs once on first boot. Changing this file REPLACES the instance (user_data change).
package_update: true
packages:
  - nginx
write_files:
  - path: /var/www/html/index.html
    content: |
      <h1>Hello from Terraform on AWS 🚀</h1>
      <p>Built by the DevOps bootcamp, Terraform Module 08.</p>
runcmd:
  - systemctl enable --now nginx
