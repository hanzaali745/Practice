# Labs 2 + 4 — jobs that depend on each other, pass values, run conditionally and write a summary
name: jobs-and-outputs

on:
  push:
  pull_request:
  workflow_dispatch:

env:                                       # workflow-level env: every job sees it
  APP_NAME: demo-app

defaults:
  run:
    shell: bash                            # bash with -eo pipefail on every run step

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}      # expose a step output as a JOB output
      is_release: ${{ steps.calc.outputs.is_release }}
    steps:
      - name: Work out the version
        id: calc
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ $REF_TYPE == tag && $REF_NAME == v* ]]; then
            version=${REF_NAME#v}; is_release=true
          else
            version="0.0.0-${SHA::7}"; is_release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"       # step outputs are lines in this file
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  test:
    needs: version                          # waits for "version"; can read its outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pretend to test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "testing $APP_NAME $VERSION"

  lint:
    needs: version                          # test and lint run in PARALLEL after version
    runs-on: ubuntu-latest
    continue-on-error: true                 # a failure here doesn't fail the workflow (use rarely!)
    steps:
      - run: echo "linting..."

  release:
    needs: [version, test]
    if: needs.version.outputs.is_release == 'true'      # only for v* tags
    runs-on: ubuntu-latest
    steps:
      - run: echo "releasing ${{ needs.version.outputs.version }}"

  summary:
    needs: [version, test, lint, release]
    if: always()                            # run even if something before failed or was skipped
    runs-on: ubuntu-latest
    steps:
      - name: Write the job summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          {
            echo "## $APP_NAME $VERSION"
            echo "| job | result |"
            echo "|-----|--------|"
            echo "| test | $TEST |"
            echo "| lint | $LINT |"
            echo "| release | $RELEASE |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
