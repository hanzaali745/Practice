# Lab 2 — the GREEN (new) version
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo-bg, color: green}
  template:
    metadata:
      labels: {app: demo-bg, color: green}
    spec:
      containers:
        - name: app
          image: demo-app:1.1.0
          env:
            - {name: APP_VERSION, value: "1.1.0-green"}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
