# Delivery — every push to main: run CI, build ONE image, prove it, deploy it to staging, then PROMOTE THE SAME
# DIGEST to production after a human approves.
#   ci ── image (build · scan · push · sign) ── staging (GitOps bump) ── production (approval → GitOps bump)
name: delivery

on:
  push:
    branches: [main]
    paths-ignore: [deploy/overlays/**]       # our own deploy commits must not start another delivery
  workflow_dispatch:

permissions: {}

concurrency:
  group: delivery
  cancel-in-progress: false                  # never interrupt a deployment

jobs:
  ci:
    uses: ./.github/workflows/ci.yml         # the same gate pull requests passed
    permissions:
      contents: read

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: demo-app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress demo-app:scan
      - id: build
        name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.vars.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  staging:
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write                        # push the deploy commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false         # the token is used once, below — never left on disk
      - name: GitOps bump (by digest — immutable)
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/bump_image.sh deploy/overlays/staging/kustomization.yaml "$IMAGE" "$TAG" "$DIGEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(staging): demo-app $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

  production:
    needs: [image, staging]
    runs-on: ubuntu-latest
    environment:
      name: production                       # required reviewers: check staging first, then approve
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main                          # includes the staging commit
          persist-credentials: false
      - name: Promote the same digest to production
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/bump_image.sh deploy/overlays/production/kustomization.yaml "$IMAGE" "$TAG" "$DIGEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(production): demo-app $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
