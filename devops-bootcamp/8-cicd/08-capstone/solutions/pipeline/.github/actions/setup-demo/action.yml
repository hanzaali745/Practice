# Lab 1 — a COMPOSITE action: several steps packaged as one, used as  uses: ./.github/actions/setup-demo
name: Set up demo-app tooling
description: Install Python with pip caching and the project's dev requirements

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

outputs:
  python-version:
    description: The exact Python version installed
    value: ${{ steps.py.outputs.python-version }}

runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Install dev requirements
      shell: bash                       # composite run steps MUST say which shell
      run: pip install -r requirements-dev.txt
