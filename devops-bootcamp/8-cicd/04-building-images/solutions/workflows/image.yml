# Module 04 — build, scan, push, sign and attest the demo-app image on GHCR
#   pull request → build + scan only (nothing is pushed)
#   push to main → ghcr.io/OWNER/REPO:sha-abc1234 and :main
#   tag v1.2.3   → also :1.2.3, :1.2 and :latest
name: image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}       # must be lowercase — rename your repo if it isn't

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write                          # push to GHCR with the built-in GITHUB_TOKEN
      id-token: write                          # keyless signing + attestations (OIDC)
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-qemu-action@v4      # emulate arm64 so we can build multi-arch
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for scanning (local, amd64 only)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true                           # into the runner's Docker so we can scan it
          tags: demo-app:scan
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for vulnerabilities (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress demo-app:scan

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha                 # reuses the layers from the scan build
          provenance: mode=max                 # SLSA provenance: how and from what it was built
          sbom: true                           # software bill of materials: what's inside

      - name: Attest build provenance (GitHub-native)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v4
        if: github.event_name != 'pull_request'

      - name: Sign the image (keyless, with this workflow's identity)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
            echo "Deploy by digest: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
