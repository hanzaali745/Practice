# Module 05 — Grafana with provisioned data source and dashboards (all from files in Git)
name: mon05

services:
  app:
    build:
      context: ../../../4-docker/app
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY app.py /app/app.py
        USER 10001
        CMD ["python3", "/app/app.py"]
    deploy:
      replicas: 2

  load:
    image: python:3.12-slim
    command: ["python3", "/loadgen.py", "http://app:8000", "15"]
    volumes: ["./loadgen.py:/loadgen.py:ro"]
    depends_on: [app]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-bootcamp}     # lab only — set GRAFANA_PASSWORD in .env
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  grafana-data:
