# kube-prometheus-stack values for the kind lab cluster (Phase 5). Keep it small.
grafana:
  adminPassword: bootcamp               # lab only — use a Secret (admin.existingSecret) for real clusters
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard          # any ConfigMap with this label becomes a dashboard
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    retention: 2d
    # By default the operator only picks up ServiceMonitors/rules labelled for THIS Helm release.
    # false = pick up every ServiceMonitor and PrometheusRule in the cluster (easier for the lab).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

# kind runs these control-plane parts in a way Prometheus can't scrape by default — skip them in the lab
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
