# Lab 4 — SLO: "99.5% of demo-app requests succeed" (error budget = 0.5%) with MULTI-WINDOW BURN-RATE alerts.
# Burn rate = how fast you spend the budget. 1 = exactly on budget for the month; 14.4 = a month's budget in ~2 days.
# (Google SRE Workbook, chapter 5: "Alerting on SLOs")
groups:
  - name: demo-app-slo
    interval: 30s
    rules:
      # the error ratio over several windows
      - record: job:slo_errors:ratio_rate5m
        expr: sum by (job) (rate(http_requests_total{job="demo-app",code=~"5.."}[5m])) / sum by (job) (rate(http_requests_total{job="demo-app"}[5m]))
      - record: job:slo_errors:ratio_rate30m
        expr: sum by (job) (rate(http_requests_total{job="demo-app",code=~"5.."}[30m])) / sum by (job) (rate(http_requests_total{job="demo-app"}[30m]))
      - record: job:slo_errors:ratio_rate1h
        expr: sum by (job) (rate(http_requests_total{job="demo-app",code=~"5.."}[1h])) / sum by (job) (rate(http_requests_total{job="demo-app"}[1h]))
      - record: job:slo_errors:ratio_rate6h
        expr: sum by (job) (rate(http_requests_total{job="demo-app",code=~"5.."}[6h])) / sum by (job) (rate(http_requests_total{job="demo-app"}[6h]))

      # how much of the 30-day budget is left (1 = all, 0 = none, negative = SLO broken)
      - record: job:slo_error_budget:remaining_30d
        expr: |
          1 - (
            sum by (job) (increase(http_requests_total{job="demo-app",code=~"5.."}[30d]))
            /
            sum by (job) (increase(http_requests_total{job="demo-app"}[30d]))
          ) / 0.005

      # FAST burn: 2% of the monthly budget in 1 hour → page someone now
      - alert: DemoAppErrorBudgetFastBurn
        expr: |
          job:slo_errors:ratio_rate1h > (14.4 * 0.005)
          and
          job:slo_errors:ratio_rate5m > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "demo-app is burning its error budget 14× too fast"
          description: "At this rate the 30-day error budget (0.5%) is gone in about 2 days."
          runbook_url: "https://github.com/YOUR-USER/cicd-lab/blob/main/runbooks/demo-app.md#demoapperrorbudgetfastburn"

      # SLOW burn: 5% of the budget in 6 hours → a ticket for working hours
      - alert: DemoAppErrorBudgetSlowBurn
        expr: |
          job:slo_errors:ratio_rate6h > (6 * 0.005)
          and
          job:slo_errors:ratio_rate30m > (6 * 0.005)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "demo-app is burning its error budget 6× too fast"
          runbook_url: "https://github.com/YOUR-USER/cicd-lab/blob/main/runbooks/demo-app.md#demoapperrorbudgetslowburn"
