# nginx in front of every demo-app replica (Docker DNS re-resolved every 10 s, so scaling just works)
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://app:8000;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /metrics {                    # app metrics are for Prometheus, not the internet
        return 404;
    }
}
