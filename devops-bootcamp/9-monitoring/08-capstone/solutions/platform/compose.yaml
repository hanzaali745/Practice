# Monitoring capstone — the demo platform with full observability
#   users → nginx → demo-app ×3 → Redis
#   Prometheus (+ exporters, rules, SLOs) → Alertmanager → receiver ("Slack/PagerDuty")
#   Grafana: RED, USE and SLO dashboards, all provisioned from Git
name: obs

x-app-build: &app-build
  context: ../../../../4-docker/app
  dockerfile_inline: |
    FROM python:3.12-slim
    COPY app.py /app/app.py
    USER 10001
    CMD ["python3", "/app/app.py"]

services:
  nginx:
    image: nginx:1.29-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:8080:80"]
    depends_on: [app]

  app:
    build: *app-build
    environment:
      REDIS_HOST: redis
      APP_VERSION: ${APP_VERSION:-2.0.0}
    deploy:
      replicas: 3
    depends_on: [redis]

  redis:
    image: redis:7-alpine

  load:
    image: python:3.12-slim
    command: ["python3", "/loadgen.py", "http://nginx", "15", "${ERROR_FRACTION:-0.002}"]
    volumes: ["./loadgen.py:/loadgen.py:ro"]
    depends_on: [nginx]

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    environment: {REDIS_ADDR: "redis://redis:6379"}

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro"]

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes: ["./blackbox.yml:/etc/blackbox/blackbox.yml:ro"]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes: ["./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:9093:9093"]

  receiver:
    image: python:3.12-slim
    command: ["python3", "-u", "/alert_receiver.py", "5001"]
    volumes:
      - ./alert_receiver.py:/alert_receiver.py:ro
      - receiver-data:/data

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-bootcamp}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

volumes:
  prometheus-data:
  grafana-data:
  receiver-data:
