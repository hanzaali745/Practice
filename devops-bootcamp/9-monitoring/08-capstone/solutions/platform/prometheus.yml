global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels: {cluster: lab, env: capstone}

rule_files: ["/etc/prometheus/rules/*.yml"]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: demo-app
    dns_sd_configs: [{names: ["app"], type: A, port: 8000}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: blackbox-site                       # the user's view: through nginx
    metrics_path: /probe
    params: {module: [http_health_json]}
    static_configs: [{targets: ["http://nginx/health"]}]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
