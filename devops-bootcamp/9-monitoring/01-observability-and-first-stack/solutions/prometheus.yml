# Module 01 — the smallest useful Prometheus configuration
global:
  scrape_interval: 15s          # how often to pull metrics from every target
  evaluation_interval: 15s      # how often to evaluate rules (Module 06)

scrape_configs:
  - job_name: prometheus        # Prometheus monitors itself
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node              # the machine
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: demo-app          # our application
    static_configs:
      - targets: ["app:8000"]   # GET http://app:8000/metrics every 15 s
