# Module 01 — your first monitoring stack: Prometheus scraping itself, the host (node-exporter) and demo-app
#   docker compose up -d --build     →  Prometheus UI: http://localhost:9090
name: mon01

services:
  app:
    build:
      context: ../../../4-docker/app            # the same demo-app as Phases 4-8, now with /metrics
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY app.py /app/app.py
        USER 10001
        CMD ["python3", "/app/app.py"]
    environment:
      APP_VERSION: "1.0.0"
    ports: ["127.0.0.1:8000:8000"]

  node-exporter:                                # metrics about the MACHINE: CPU, memory, disk, network
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

volumes:
  prometheus-data:
