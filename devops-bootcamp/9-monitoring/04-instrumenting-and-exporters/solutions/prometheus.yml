global:
  scrape_interval: 10s

scrape_configs:
  - job_name: demo-app
    static_configs: [{targets: ["app:8000"]}]

  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]

  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]

  - job_name: backups                                # backup_exporter.py on the host
    static_configs: [{targets: ["host.docker.internal:9300"]}]

  # The blackbox pattern: the TARGET is what to probe; the scrape goes to the exporter with ?target=...&module=...
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_health_json]
    static_configs:
      - targets: ["http://app:8000/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target                 # ?target=http://app:8000/health
      - source_labels: [__param_target]
        target_label: instance                       # show the probed URL as the instance
      - target_label: __address__
        replacement: blackbox:9115                   # ...but actually scrape the exporter

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["redis:6379"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
