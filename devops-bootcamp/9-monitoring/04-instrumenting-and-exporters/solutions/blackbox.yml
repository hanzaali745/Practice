# blackbox_exporter: probe things FROM THE OUTSIDE, the way a user would
modules:
  http_2xx:                     # GET the URL, expect a 2xx
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
  http_health_json:             # GET /health, expect 200 and "ok" in the body
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp: ['"status": "ok"']
      preferred_ip_protocol: ip4
  tcp_connect:                  # can we open a TCP connection? (Redis, databases)
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
