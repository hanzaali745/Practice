global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files: ["/etc/prometheus/rules/*.yml"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-app
    dns_sd_configs: [{names: ["app"], type: A, port: 8000}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
