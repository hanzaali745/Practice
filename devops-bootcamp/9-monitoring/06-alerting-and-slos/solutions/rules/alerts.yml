# Module 06 — alerting rules. Every alert needs: a clear name, a "for", a severity, a summary and a runbook.
groups:
  - name: demo-app
    rules:
      - alert: DemoAppDown
        expr: up{job="demo-app"} == 0
        for: 1m                              # must be true for 1 min — ignores single failed scrapes
        labels:
          severity: critical
        annotations:
          summary: "demo-app instance {{ $labels.instance }} is down"
          description: "Prometheus could not scrape {{ $labels.instance }} for more than 1 minute."
          runbook_url: "https://github.com/YOUR-USER/runbooks/blob/main/demo-app.md#demoappdown"

      - alert: DemoAppHighErrorRate
        expr: job:http_requests_errors:ratio_rate5m{job="demo-app"} > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "demo-app error ratio is {{ $value | humanizePercentage }}"
          description: "More than 5% of requests failed with a 5xx for 2 minutes."
          runbook_url: "https://github.com/YOUR-USER/runbooks/blob/main/demo-app.md#demoapphigherrorrate"

      - alert: DemoAppHighLatency
        expr: job:http_request_duration_seconds:p95_5m{job="demo-app"} > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "demo-app p95 latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/YOUR-USER/runbooks/blob/main/demo-app.md#demoapphighlatency"

  - name: dependencies
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down — /visits is failing"
          runbook_url: "https://github.com/YOUR-USER/runbooks/blob/main/redis.md#redisdown"

      - alert: DemoAppMissing                  # the whole job vanished: no "up" series at all
        expr: absent(up{job="demo-app"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No demo-app targets are being scraped at all"
          runbook_url: "https://github.com/YOUR-USER/runbooks/blob/main/demo-app.md#demoappmissing"
