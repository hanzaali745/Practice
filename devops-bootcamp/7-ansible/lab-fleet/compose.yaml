# Practice fleet: 3 Ubuntu "servers" for the Ansible track. Managed with ./fleet.sh
name: fleet

x-node: &node
  build: .
  image: ansible-lab-node:24.04
  privileged: true             # systemd inside a container needs this (lab only!)
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - ./.ssh/id_ed25519.pub:/home/devops/.ssh/authorized_keys:ro
  tmpfs:
    - /run
    - /run/lock
    - /tmp

services:
  web1:
    <<: *node
    hostname: web1
    ports: ["127.0.0.1:2221:22", "127.0.0.1:8081:80"]
  web2:
    <<: *node
    hostname: web2
    ports: ["127.0.0.1:2222:22", "127.0.0.1:8082:80"]
  db1:
    <<: *node
    hostname: db1
    ports: ["127.0.0.1:2223:22", "127.0.0.1:8083:80"]
