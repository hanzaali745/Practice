# The practice fleet (created by ./fleet.sh up)
[web]
web1 ansible_port=2221 http_port=8081
web2 ansible_port=2222 http_port=8082

[db]
db1 ansible_port=2223 http_port=8083

[fleet:children]
web
db

[fleet:vars]
ansible_host=127.0.0.1
ansible_user=devops
ansible_ssh_private_key_file={{ inventory_dir }}/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
