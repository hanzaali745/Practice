# The lab fleet (7-ansible/lab-fleet). A real project has one inventory folder per environment:
# inventories/lab, inventories/staging, inventories/prod — each with its own group_vars and vault.
[web]
web1 ansible_port=2221
web2 ansible_port=2222

[db]
db1 ansible_port=2223

[fleet:children]
web
db

[fleet:vars]
ansible_host=127.0.0.1
ansible_user=devops
lab_fleet_dir={{ inventory_dir }}/../../../../../lab-fleet
ansible_ssh_private_key_file={{ lab_fleet_dir }}/.ssh/id_ed25519
