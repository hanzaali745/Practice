---
# Labs 2-3 — nginx web servers with a per-host page, plus SSH hardening
- name: Web servers
  hosts: web
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [web]

    - name: Manage the default site ourselves (explicit config; also works on hosts without IPv6)
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        content: |
          # Managed by Ansible
          server {
              listen 80 default_server;
              root /var/www/html;
              index index.html;
          }
        mode: "0644"
      tags: [web]

    - name: Write a page that says which server answered
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Hello from {{ inventory_hostname }}</h1>
          <p>Configured by Ansible.</p>
        mode: "0644"
      tags: [web]

    - name: Make sure nginx is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started   # config changes need a restart → handlers (Module 04)
        enabled: true
      # In --check mode nginx was only *pretend*-installed, so starting it can't work: don't fail the dry run.
      ignore_errors: "{{ ansible_check_mode }}"
      tags: [web]

    - name: Check the site answers
      ansible.builtin.uri:
        url: http://localhost/
        return_content: true
      register: page
      failed_when: inventory_hostname not in page.content
      when: not ansible_check_mode
      tags: [web]

    - name: Disable root login over SSH (validated before writing)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
        validate: /usr/sbin/sshd -t -f %s
      tags: [ssh]
